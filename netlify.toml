# Configuration Netlify — emma-broderie.fr

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# --- Espace d'administration secret ---
# Le chemin n'est volontairement PAS dans robots.txt (fichier public).
# On empêche l'indexation par en-tête HTTP + balise meta dans les pages.
# Le questionnaire vierge (questionnaire.xlsx), le manifeste et le service
# worker vivent sous ce même chemin : mêmes en-têtes.
# ⚠️ Le dépôt est public : ce chemin y est lisible. La vraie protection est
# côté serveur (toutes les fonctions de données exigent une session).
[[headers]]
  for = "/atelier-mqu3gf/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# ⚠️ PROVISOIRE — à retirer au passage sur emma-broderie.fr
# Le site tourne sur le sous-domaine netlify.app avec des valeurs d'exemple
# (prix, délais, avis, numéro de téléphone) et des mentions légales
# incomplètes. On le rend visible par lien, mais on le tient hors des moteurs
# de recherche : sinon il devient la vitrine publique d'Emma, et il fera
# doublon avec le vrai domaine le jour où celui-ci existera.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Images et assets générés par Astro : empreinte dans le nom → cache long
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
